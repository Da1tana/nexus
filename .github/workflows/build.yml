name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon --stacktrace :core:engine:test

      - name: Unit test summary
        if: always()
        run: |
          for f in core/engine/build/test-results/test/*.xml; do
            grep -o '<testsuite name="[^"]*" tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*"' "$f" || true
          done

      - name: Assemble debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK exists
        run: |
          test -f releases/NEXUS-debug.apk
          ls -la releases/

      - name: Print Room schema
        run: find core/data/schemas -name '*.json' -exec sh -c 'echo "=== $1"; cat "$1"' _ {} \;

      - name: Publish debug build as GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete debug-latest --yes --cleanup-tag || true
          gh release create debug-latest releases/NEXUS-debug.apk \
            --prerelease \
            --title "NEXUS debug ${GITHUB_SHA::7}" \
            --notes "Автоматическая debug-сборка из main (${GITHUB_SHA::7}). Установка: скачать NEXUS-debug.apk на телефон и открыть."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-debug-apk
          path: releases/NEXUS-debug.apk

      - name: Upload Room schemas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: core/data/schemas/
          if-no-files-found: ignore

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          if-no-files-found: ignore

  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumented tests (emulator API 30)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          script: ./gradlew --no-daemon :core:data:connectedDebugAndroidTest :app:connectedDebugAndroidTest
      - name: Upload instrumented reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-reports
          path: '**/build/reports/androidTests/'
          if-no-files-found: ignore
