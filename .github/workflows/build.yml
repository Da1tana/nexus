name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon --stacktrace :core:engine:test

      - name: Unit test summary
        if: always()
        run: |
          for f in core/engine/build/test-results/test/*.xml; do
            grep -o '<testsuite name="[^"]*" tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*"' "$f" || true
          done

      - name: Assemble debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK exists
        run: |
          test -f releases/NEXUS-debug.apk
          ls -la releases/

      - name: Sign APK with v1+v2+v3 (apksigner)
        # AGP не ставит v1 (JAR) подпись при minSdk >= 24; часть установщиков (EMUI/HarmonyOS) надёжнее работает с полным набором.
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" sign --ks keys/nexus-debug.jks --ks-pass pass:nexusdebug --ks-key-alias nexus-debug --key-pass pass:nexusdebug \
            --min-sdk-version 21 --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out releases/NEXUS-debug-signed.apk releases/NEXUS-debug.apk
          mv releases/NEXUS-debug-signed.apk releases/NEXUS-debug.apk
          rm -f releases/NEXUS-debug.apk.idsig

      - name: Verify APK signature (apksigner)
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -c -P 16 4 releases/NEXUS-debug.apk && echo "zipalign: OK"
          "$BT/apksigner" verify --min-sdk-version 21 --verbose --print-certs releases/NEXUS-debug.apk | tee apksigner.txt
          grep -q "Verified using v1 scheme (JAR signing): true" apksigner.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" apksigner.txt
          grep -q "CN=NEXUS Debug" apksigner.txt
          "$BT/aapt2" dump badging releases/NEXUS-debug.apk | grep -E "^package|sdkVersion|targetSdkVersion"

      - name: Print Room schema
        run: find core/data/schemas -name '*.json' -exec sh -c 'echo "=== $1"; cat "$1"' _ {} \;

      - name: Publish debug build as GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete debug-latest --yes --cleanup-tag || true
          SIZE=$(stat -c %s releases/NEXUS-debug.apk)
          SHA=$(sha256sum releases/NEXUS-debug.apk | cut -d' ' -f1)
          VERSION=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | cut -d'"' -f2)
          printf '%s\n' \
            "Автоматическая debug-сборка NEXUS $VERSION из main (${GITHUB_SHA::7})." \
            "" \
            "Размер файла: $SIZE байт. Если скачанный файл меньше — загрузка оборвалась, скачайте заново." \
            "SHA-256: $SHA" \
            "" \
            "Установка: скачать NEXUS-debug.apk на телефон и открыть." > notes.txt
          gh release create debug-latest releases/NEXUS-debug.apk \
            --prerelease \
            --title "NEXUS $VERSION debug (${GITHUB_SHA::7})" \
            --notes-file notes.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-debug-apk
          path: releases/NEXUS-debug.apk

      - name: Upload Room schemas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: core/data/schemas/
          if-no-files-found: ignore

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          if-no-files-found: ignore

  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumented tests (emulator API 30)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          script: ./gradlew --no-daemon :core:data:connectedDebugAndroidTest :app:connectedDebugAndroidTest
      - name: Upload instrumented reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-reports
          path: '**/build/reports/androidTests/'
          if-no-files-found: ignore
